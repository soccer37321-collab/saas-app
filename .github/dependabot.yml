version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    versioning-strategy: "auto"
    groups:
      supabase:
        patterns: ["@supabase/*"]
      stripe:
        patterns: ["stripe"]
      anthropic:
        patterns: ["@anthropic-ai/*"]
    ignore:
      # next メジャーバージョンアップは手動で対応
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
