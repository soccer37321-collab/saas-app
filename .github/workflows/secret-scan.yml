name: Secret Scan

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  gitleaks:
    name: Detect hardcoded secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pattern-check:
    name: Check for common secret patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Scan for hardcoded secrets
        run: |
          set +e
          FOUND=0

          # Anthropic API keys
          if grep -rn "sk-ant-api" --include="*.ts" --include="*.tsx" --include="*.js" \
              --exclude-dir=".git" --exclude-dir="node_modules" --exclude-dir=".next" .; then
            echo "❌ Anthropic APIキーが検出されました"
            FOUND=1
          fi

          # Stripe live secret keys (test keys are allowed in .env.example)
          if grep -rn "sk_live_" --include="*.ts" --include="*.tsx" --include="*.js" \
              --exclude-dir=".git" --exclude-dir="node_modules" --exclude-dir=".next" .; then
            echo "❌ Stripe本番シークレットキーが検出されました"
            FOUND=1
          fi

          # Supabase service role JWT (long base64 string with "service_role")
          if grep -rn '"service_role"' --include="*.ts" --include="*.tsx" \
              --exclude-dir=".git" --exclude-dir="node_modules" --exclude-dir=".next" \
              --exclude="*.md" .; then
            echo "❌ Supabase service role キーが検出されました"
            FOUND=1
          fi

          # Generic password/secret assignments (excluding test files and docs)
          if grep -rEn '(password|secret|api_key)\s*=\s*["'"'"'][^${"'"'"']{8,}' \
              --include="*.ts" --include="*.tsx" \
              --exclude-dir=".git" --exclude-dir="node_modules" --exclude-dir=".next" \
              --exclude="*.test.*" --exclude="*.spec.*" . | \
              grep -v "process\.env\|placeholder\|example\|test\|dummy"; then
            echo "❌ ハードコードされた機密情報が検出された可能性があります"
            FOUND=1
          fi

          if [ $FOUND -eq 0 ]; then
            echo "✅ 機密情報のハードコードは検出されませんでした"
          fi

          exit $FOUND
